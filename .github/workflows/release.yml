# Push a tag vX.Y.Z on main → both packages are published to npm (registry.npmjs.org), public:
# any project installs them with a plain pnpm/npm/yarn install, no .npmrc and no token.
# Trusted publishing: npm trusts this workflow (each package's Settings → Trusted publisher →
# GitHub Actions, AbbasAlsbihawi/core, release.yml) and the job proves itself with an OIDC token —
# no NPM_TOKEN secret. npm publishes, not pnpm: npm documents OIDC from 11.5.1, and the packages
# have no workspace: dependencies or publish scripts for pnpm to rewrite.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for a one-time publish credential

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check # the tag must match both versions and the CHANGELOG (check-release)
      - run: npm install -g npm@11.6.2 # trusted publishing needs npm >= 11.5.1
      - run: for p in config core; do (cd "packages/$p" && npm publish --access public) || exit 1; done
