# Push a tag vX.Y.Z on main → both packages are published to GitHub Packages (npm.pkg.github.com).
# GITHUB_TOKEN publishes; repositories that install them get read access in each package's
# settings ("Manage Actions access") and use their own GITHUB_TOKEN.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@abbasalsbihawi'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check # the tag must match both versions and the CHANGELOG (check-release)
      - run: pnpm -r publish --no-git-checks --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
